services:
  postgresdb:
    image: postgres:14.11
    container_name: postgres_container_jsonmanager
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrics_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=metrics_db
      - POSTGRES_PASSWORD=CayPayPGDocker24!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jsonmanager_network

  backend:
    image: jsonmanager_backend
    container_name: cp_backend_jsonmanager
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    environment:
      - PGUSER=postgres
      - PGHOST=postgresdb
      - PGDATABASE=metrics_db
      - PGPASSWORD=CayPayPGDocker24!
      - PGPORT=5432
      - APP_PORT=3005
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jsonmanager_network
    ports:
      - "3005:3005"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3005/info/version').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s


volumes:
  postgres_data: {}

networks:
  jsonmanager_network:
    driver: bridge
